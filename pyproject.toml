[project]
# Nom publié : `airflow-dag-gantt` est pris sur PyPI public (donc servi par `pythonproxy`) → le
# suffixe `-d2b` ferme la dependency confusion. Lui seul le porte : import, entry point, URL.
name = "airflow-dag-gantt-d2b"
# La version vient du tag git (§ [tool.hatch.version] plus bas) : un champ `version` statique
# ici ferait échouer hatchling (`Metadata field 'version' cannot be both statically defined and
# listed in project.dynamic`) donc `uv lock`, `uv build` et tous les jobs qui en découlent.
dynamic = ["version"]
description = "Global Dag Gantt — vue macro de tous les DagRun d'une journée (Airflow 3.1+)"
readme = "README.md"
# 3.13 = plancher réel du déploiement : Astro Runtime 3.2/3.3 = Python 3.13–3.14 (défaut 3.14),
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antoine Giraud" }]
keywords = ["airflow", "plugin", "gantt", "dag", "observability"]
classifiers = [
    "Framework :: Apache Airflow",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Ne PAS épingler 3.3 : react_apps/fastapi_apps existent depuis Airflow 3.1.
dependencies = [
    "apache-airflow>=3.2", #airflow
]

[build-system]
# 1.26 = premier hatchling à gérer PEP 639 (`license` SPDX + `license-files`).
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# Modèle `s3-ojs` : le tag git est la source de vérité, semantic-release le crée.
# Tags **sans `v`** (`0.7.4`) ; les `v0.7.x` historiques restent lisibles (setuptools-scm
# tolère le préfixe `v`). Hors tag : `0.7.4.devN+g<sha>` (PEP 440 locale) — la CI ne publie
# que sur tag, ces versions là ne rejoignent jamais le registre.
[tool.hatch.version]
source = "vcs"

[project.urls]
Homepage = "https://gitlab.tech.orange/data-platform-b2b/core/airflow-plugin-dag-gantt"
Repository = "https://gitlab.tech.orange/data-platform-b2b/core/airflow-plugin-dag-gantt"
Issues = "https://gitlab.tech.orange/data-platform-b2b/core/airflow-plugin-dag-gantt/-/issues"

# Groupe `dev` (et non `[project.optional-dependencies]` : `uv sync` installe les groupes par
# défaut, les extras non) — c'est ce que la CI GitLab fait dans `py-pytest`.
[dependency-groups]
dev = [
    # httpx : requis par `fastapi.testclient` — sans lui, `test_api_runs_contract` se
    # **taisait** (skip silencieux) hors conteneur.
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

# Découverte automatique par Airflow : pas de fichier dans $PLUGINS_FOLDER.
[project.entry-points."airflow.plugins"]
dag_gantt = "airflow_dag_gantt.plugin:DagGanttPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_dag_gantt"]
# static/ est gitignoré (généré par `bun run build`) → sans cette ligne il est exclu du wheel.
artifacts = ["/src/airflow_dag_gantt/static/*"]

[tool.hatch.build.targets.sdist]
# '/' ancre les patterns à la racine (sinon 'src' attrape aussi plugins/*/src).
include = ["/src", "/js", "/hatch_build.py", "/pyproject.toml", "/README.md"]
# Exclus même hors dépôt git (les patterns .gitignore ne s'appliquent alors pas).
exclude = [
    "/js/node_modules",
    "/js/dist",
    "/src/airflow_dag_gantt/static",
    "/dist",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".astro", "*.md"]

[tool.ruff.lint]
# Règles utiles sans être punitives ; DTZ/BLE/RUF012 sont volontairement hors
# périmètre (le contrat Airflow impose des listes mutables en attributs de classe).
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["airflow_dag_gantt"]
